<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Digikala HomePage</title>
    <script defer src="script.js"></script>
  </head>
  <body>
    <header>
      <div class="header">
        <!-- LOGO -->
        <nav class="nav">
          <img
            src="img/digikala.svg"
            alt="Digikala logo"
            class="nav-logo"
            id="logo"
          />
        </nav>
        <!-- Search Box -->
        <form class="search">
          <input type="search" placeholder="جستجو محصولات" />
          <button type="submit">جستجو</button>
        </form>
        <!-- User -->
        <div class="user-action">
          <button class="login-btn">ورود / ثبت نام</button>
          <img src="img/shopping_cart.svg" class="shopping-cart" />
        </div>
      </div>
    </header>
  </body>
</html>
