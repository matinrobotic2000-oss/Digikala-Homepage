<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Digikala HomePage</title>
    <script defer src="script.js"></script>
  </head>
  <body>
    <header>
      <div class="header">
        <!-- LOGO -->
        <nav class="nav">
          <img
            src="img/digikala.svg"
            alt="Digikala logo"
            class="nav-logo"
            id="logo"
          />
        </nav>
        <!-- Search Box -->
        <form class="search">
          <input type="search" placeholder="جستجو محصولات" />
          <button type="submit">جستجو</button>
        </form>
        <!-- User -->
        <div class="user-action">
          <button class="login-btn">ورود / ثبت نام</button>
          <img src="img/shopping_cart.svg" class="shopping-cart" />
        </div>
      </div>
    </header>
    <!-- NAV LINKS -->
    <nav class="navigation">
      <div class="navigation-container">
        <button>دسته بندی کالاها</button>
        <ul class="nav-links">
          <li class="nav-item">
            <a href="#">شگفت انگیزها</a>
          </li>
          <li class="nav-item"><a href="#" class="nav__link">سوپر مارکت</a></li>
          <li class="nav-item">
            <a href="#" class="nav__link">طلا و نقره دیجیتال</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav__link">پرفروش ترین ها</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav__link">دیجی استایل</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav__link">در دیجیکالا بفروشید</a>
          </li>
        </ul>
      </div>
    </nav>
    <section class="hero">
      <div class="hero-slider">
        <img src="img/hero1.webp" />
      </div>
      <div class="hero-slider">
        <img src="img/hero2.gif" />
      </div>
      <div class="hero-slider">
        <img src="img/hero3.webp" />
      </div>
      <div class="hero-slider">
        <img src="img/hero4.webp" />
      </div>
      <div class="hero-slider">
        <img src="img/hero5.webp" />
      </div>
      <div class="slider-controls">
        <button>بعدی</button>
        <button>قبلی</button>
      </div>
    </section>
    <section class="categories">
      <div class="section-header">
        <h2>دسته بندی ها</h2>
      </div>
      <div class="category-list">
        <img src="img/mobile.webp" />
        <h3>موبایل</h3>
      </div>
      <div class="category-list">
        <img src="img/laptop.webp" />
        <h3>لبتاپ</h3>
      </div>
      <div class="category-list">
        <img src="img/kichentool.webp" />
        <h3>لوازم آشپزخانه</h3>
      </div>
      <div class="category-list">
        <img src="img/petshop.webp" />
        <h3>پتشاپ</h3>
      </div>
      <div class="category-list">
        <img src="img/hometool.webp" />
        <h3>لوازم خانه</h3>
      </div>
    </section>
  </body>
</html>
